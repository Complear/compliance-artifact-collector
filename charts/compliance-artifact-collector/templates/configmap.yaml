{{- if and (or .Values.input.files .Values.input.binaryFiles) (not .Values.input.existingConfigMap) (not .Values.input.existingClaim) }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "cac.inputConfigMap" . }}
  labels:
    {{- include "cac.labels" . | nindent 4 }}
data:
  {{- range $name, $content := .Values.input.files }}
  {{ $name }}: |
    {{- $content | nindent 4 }}
  {{- end }}
{{- with .Values.input.binaryFiles }}
binaryData:
  {{- range $name, $content := . }}
  {{ $name }}: {{ $content | quote }}
  {{- end }}
{{- end }}
{{- end }}
