{{- if and .Values.output.persistence.enabled (not .Values.output.persistence.existingClaim) }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "cac.outputClaim" . }}
  labels:
    {{- include "cac.labels" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes:
    {{- toYaml .Values.output.persistence.accessModes | nindent 4 }}
  {{- with .Values.output.persistence.storageClassName }}
  storageClassName: {{ . }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.output.persistence.size }}
{{- end }}
