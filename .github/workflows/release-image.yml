# Builds the Collector image, pushes it to ghcr.io, signs it keylessly with cosign (GitHub OIDC)
# and attaches its CycloneDX SBOM as a signed attestation.
#
# Check a pulled image:
#   cosign verify ghcr.io/complear/compliance-artifact-collector@<digest> \
#     --certificate-identity-regexp 'https://github.com/Complear/compliance-artifact-collector/.github/workflows/release-image.yml@refs/tags/v.*' \
#     --certificate-oidc-issuer https://token.actions.githubusercontent.com
name: release-image

on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  packages: write
  id-token: write

env:
  IMAGE: ghcr.io/complear/compliance-artifact-collector

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Benchmark (rule engine used for AI Act scoping)
        uses: actions/checkout@v4
        with:
          repository: Complear/aiod-compliance-benchmark
          # Pinned so a release rebuild is reproducible and cannot pick up an unreviewed rule engine.
          ref: 0d44a6af1b7e6b250f1ca600fb3b9beb9cfbfecb
          path: benchmark
      - name: Version
        id: version
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' cac/__init__.py)
          if [ "${GITHUB_REF_TYPE}" = "tag" ] && [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "tag ${GITHUB_REF_NAME} does not match cac/__init__.py version ${version}" >&2; exit 1
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          build-contexts: benchmark=benchmark
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ steps.version.outputs.version }}
            ${{ env.IMAGE }}:latest
      - uses: sigstore/cosign-installer@v3
      - name: Sign
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
      - name: SBOM
        uses: anchore/sbom-action@v0
        with:
          image: ${{ env.IMAGE }}@${{ steps.build.outputs.digest }}
          format: cyclonedx-json
          output-file: sbom.cdx.json
          upload-artifact: true
      - name: Attest the SBOM
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign attest --yes --type cyclonedx --predicate sbom.cdx.json "${IMAGE}@${DIGEST}"
      - name: Summary
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          echo "Pushed and signed ${IMAGE}:${VERSION}" >> "$GITHUB_STEP_SUMMARY"
          echo "Digest: \`${DIGEST}\`" >> "$GITHUB_STEP_SUMMARY"
